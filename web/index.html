<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Voxel1 | Growth Engine</title>
  <script>try { const t = localStorage.getItem("voxel1-theme"); if (t === "dark" || t === "light") document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <link rel="stylesheet" href="/style.css?v=13">
  <link rel="stylesheet" href="/extra.css?v=14">
</head>
<body>
  <header class="topbar"><div class="tb">
    <div class="brand"><div class="logo">V</div>VOXEL1<i></i><span>Growth Engine</span></div>
    <div class="tstats">
      <span class="ts">Won / goal <b id="tot">—</b></span>
      <button class="apbtn" id="approvals" type="button">Approvals <b>0</b></button>
      <span class="ts"><span class="sdot" id="gdot"></span><span id="gstate">Loading…</span></span>
      <button class="btn" id="theme" type="button">Dark mode</button>
      <button class="btn" id="outlook" type="button">Outlook</button>
      <button class="btn" id="pause-all" type="button">Pause all</button>
    </div>
  </div></header>

  <div class="shell">
    <nav class="side" id="side" aria-label="Service workspaces"></nav>
    <main class="main" id="main"><p class="note">Loading your workspace…</p></main>
  </div>

  <div id="notice" class="notice" role="status" hidden></div>

  <dialog id="editor" class="sheet" aria-labelledby="editor-title">
    <form id="editor-form" novalidate>
      <div class="dialog-head"><h2 id="editor-title">Edit</h2><button type="button" class="btn" data-close="editor">Close</button></div>
      <p id="editor-help" class="note"></p>
      <div id="editor-fields" class="form-grid"></div>
      <p id="editor-error" class="form-error" role="alert" hidden></p>
      <div class="dialog-actions"><button type="button" class="btn" data-close="editor">Cancel</button><button class="btn pri" type="submit" id="editor-submit">Save</button></div>
    </form>
  </dialog>

  <dialog id="icp-dialog" class="sheet wide" aria-labelledby="icp-title">
    <form id="icp-form" novalidate>
      <div class="dialog-head"><h2 id="icp-title">Edit ICP (ideal customer profile)</h2><button type="button" class="btn" data-close="icp-dialog">Close</button></div>
      <p class="note" id="icp-help">Saved separately for each service. Saving does not run a search.</p>
      <div class="form-grid">
        <label class="field full"><span class="flabel">Profile name</span><input name="name" maxlength="100" required></label>
        <fieldset class="field full"><legend>Countries of focus</legend><div class="checks"><label><input type="checkbox" name="countries" value="USA"> USA</label><label><input type="checkbox" name="countries" value="UAE"> UAE</label><label><input type="checkbox" name="countries" value="Saudi Arabia"> Saudi Arabia</label><label><input type="checkbox" name="countries" value="India"> India</label><label><input type="checkbox" name="countries" value="Singapore"> Singapore</label></div></fieldset>
        <label class="field full"><span class="flabel">Other countries <span class="optional">(comma-separated)</span></span><input name="other_countries" placeholder="e.g. Germany, Australia"></label>
        <fieldset class="field full"><legend>Target industries</legend><div class="checks"><label><input type="checkbox" name="categories" value="architecture"> Architecture</label><label><input type="checkbox" name="categories" value="construction"> Construction</label><label><input type="checkbox" name="categories" value="engineering"> Engineering</label><label><input type="checkbox" name="categories" value="real_estate"> Real estate</label><label><input type="checkbox" name="categories" value="education"> Education</label></div></fieldset>
        <label class="field"><span class="flabel">Minimum employees</span><input name="employee_min" type="number" min="1" max="1000000" placeholder="Any size"></label>
        <label class="field"><span class="flabel">Maximum employees</span><input name="employee_max" type="number" min="1" max="1000000" placeholder="Any size"></label>
        <label class="field full"><span class="flabel">Decision-maker titles <span class="optional">(comma-separated)</span></span><input name="titles" maxlength="500" placeholder="e.g. BIM Manager, Project Manager, Director"></label>
        <label class="field"><span class="flabel">Positive keywords</span><input name="keywords" maxlength="500" placeholder="e.g. Revit, infrastructure"></label>
        <label class="field"><span class="flabel">Exclude keywords</span><input name="exclusions" maxlength="500" placeholder="e.g. residential-only"></label>
        <label class="field full"><span class="flabel">Campaign goal</span><input name="goal" maxlength="500" placeholder="e.g. Book a discovery meeting"></label>
        <label class="field full"><span class="flabel">Notes <span class="optional">(for your team; not a search filter)</span></span><textarea name="notes" maxlength="500" rows="2"></textarea></label>
      </div>
      <p id="icp-error" class="form-error" role="alert" hidden></p>
      <div class="dialog-actions"><span id="icp-updated" class="note"></span><button type="button" class="btn" data-close="icp-dialog">Cancel</button><button class="btn pri" type="submit">Save ICP</button></div>
    </form>
  </dialog>

  <script src="/app.js?v=26" defer></script>
</body>
</html>
